openapi: 3.0.3
info:
  title: 株みーるAPI
  description: |
    株式ポートフォリオ管理システム（通称「株みーる」）のRESTful API仕様

    ## API設計原則
    - **統一レスポンス形式**: 全エンドポイントで一貫したレスポンス構造
    - **Zodバリデーション**: 厳密な型安全性とデータ検証
    - **エラーハンドリング**: 詳細なエラー情報とHTTPステータスコード
    - **パフォーマンス**: ページネーション・キャッシュ・インデックス最適化

    ## データ処理仕様
    - **日本株**: 数字コード（例："7203"）→".T"サフィックス自動付加
    - **米国株**: 標準ティッカーシンボル使用
    - **価格更新**: ステータス追跡（SUCCESS/ERROR/PENDING）
    - **市場セッション**: 前場・後場・時間外取引の識別
  version: 1.0.0
  contact:
    name: API Support
    url: https://example.com/support
servers:
  - url: http://localhost:3300/api
    description: 開発環境
  - url: https://your-app.vercel.app/api
    description: 本番環境

# 既定で画面のセッション Cookie を要求する（ADR 0011）。
# 未認証の呼び出しは middleware が 401（UNAUTHORIZED）を返し、各エンドポイントには到達しない。
# バッチだけは cron から呼ばれるため、エンドポイント側で ApiKeyAuth に上書きしている。
security:
  - SessionCookie: []

tags:
  - name: stocks
    description: 銘柄一覧管理
  - name: holdings
    description: 保有一覧（証券会社別）
  - name: portfolio
    description: ポートフォリオ分析
  - name: transactions
    description: 取引履歴管理
  - name: dividends
    description: 受取配当管理
  - name: prices
    description: 現在値取得・価格履歴
  - name: summary
    description: 合計情報・サマリー
  - name: brokers
    description: 証券会社マスタ
  - name: settings
    description: アプリ設定
  - name: import
    description: データインポート
  - name: batch
    description: バッチ（X-API-Key / Vercel Cron から実行）

paths:
  # 銘柄一覧管理
  /stocks:
    get:
      tags: [stocks]
      summary: 銘柄一覧取得
      description: 保有している全銘柄の一覧を取得
      parameters:
        - name: includeZero
          in: query
          description: 保有株数0の銘柄も含める
          schema:
            type: boolean
            default: false
        - name: market
          in: query
          description: 市場フィルター
          schema:
            type: string
            enum: [国内, 米国]
        - name: holdingCompany
          in: query
          description: 証券会社フィルター
          schema:
            type: string
        - name: sortBy
          in: query
          description: ソート項目
          schema:
            type: string
            enum: [stock_name, profit_loss, profit_loss_rate, investment_amount]
            default: stock_name
        - name: sortOrder
          in: query
          description: ソート順
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: 銘柄一覧取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      stocks:
                        type: array
                        items:
                          $ref: '#/components/schemas/Stock'
                      totalCount:
                        type: integer
                      filters:
                        type: object
                        properties:
                          market:
                            type: array
                            items:
                              type: string
                          holdingCompany:
                            type: array
                            items:
                              type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [stocks]
      summary: 銘柄追加
      description: 新しい銘柄を追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInput'
      responses:
        '201':
          description: 銘柄追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Stock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /stocks/{id}:
    get:
      tags: [stocks]
      summary: 銘柄詳細取得
      description: 指定した銘柄の詳細情報を取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 銘柄詳細取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/StockDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [stocks]
      summary: 銘柄更新
      description: 指定した銘柄の情報を更新
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInput'
      responses:
        '200':
          description: 銘柄更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Stock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [stocks]
      summary: 銘柄削除
      description: 指定した銘柄を削除
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 銘柄削除成功
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ポートフォリオ分析
  /portfolio/composition:
    get:
      tags: [portfolio]
      summary: ポートフォリオ構成比率
      description: 銘柄別、証券会社別、市場別の構成比率を取得
      responses:
        '200':
          description: 構成比率取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      byStock:
                        type: array
                        items:
                          $ref: '#/components/schemas/CompositionItem'
                      byCompany:
                        type: array
                        items:
                          $ref: '#/components/schemas/CompositionItem'
                      byMarket:
                        type: array
                        items:
                          $ref: '#/components/schemas/CompositionItem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /portfolio/performance:
    get:
      tags: [portfolio]
      summary: パフォーマンス比較
      description: 銘柄別のパフォーマンス比較データを取得（損益率固定）
      responses:
        '200':
          description: パフォーマンス比較取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        stockName:
                          type: string
                        profitLossRate:
                          type: number
                          format: decimal
                        profitLoss:
                          type: number
                          format: decimal
                        investmentAmount:
                          type: number
                          format: decimal
        '500':
          $ref: '#/components/responses/InternalServerError'

  /portfolio/timeline:
    get:
      tags: [portfolio]
      summary: 資産推移
      description: >-
        日次の評価額・投資元本・評価損益・累計実現損益・累計配当を返す（ADR 0009）。
        保存値ではなく、取引履歴・日次終値・日次 USD/JPY レートから読み取り時に再構成した
        派生値。各日の円換算はその日のレートで行う（当日レートは使わない）。
        起点日（ADR 0008）より前は保有が不明なため返さない。
      parameters:
        - name: range
          in: query
          description: 表示期間。lastMonth だけ終点が今日ではなく前月末になる
          schema:
            type: string
            enum: [thisMonth, lastMonth, 1y, 3y, 5y, all]
            default: 1y
      responses:
        '200':
          description: 資産推移取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/TimelineResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 保有一覧（証券会社別）
  /holdings/by-broker:
    get:
      tags: [holdings]
      summary: 証券会社別保有一覧
      description: >-
        証券会社ごとにグループ化した保有一覧と、その合計を返す。
        金額（投資額・評価額・評価損益・年初来配当）は円換算済み、
        単価（平均取得単価・現在価格）は建値通貨のまま（ADR 0005）。
      parameters:
        - name: includeZero
          in: query
          description: 保有株数0の銘柄も含める
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 保有一覧取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      brokers:
                        type: array
                        items:
                          $ref: '#/components/schemas/BrokerHoldings'
                      grandTotal:
                        $ref: '#/components/schemas/HoldingsGrandTotal'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 取引履歴管理
  /transactions:
    get:
      tags: [transactions]
      summary: 取引履歴一覧取得
      description: 取引履歴の一覧を取得
      parameters:
        - name: stockId
          in: query
          description: 銘柄IDフィルター
          schema:
            type: integer
        - name: type
          in: query
          description: 取引種別フィルター
          schema:
            type: string
            enum: [BUY, SELL]
        - name: startDate
          in: query
          description: 開始日
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: 終了日
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: ページ番号
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: 1ページあたりの件数
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 取引履歴取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransactionListItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [transactions]
      summary: 取引追加
      description: 新しい取引を追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: 取引追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions/{id}:
    get:
      tags: [transactions]
      summary: 取引詳細取得
      description: 指定した取引 1 件を取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 取引取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [transactions]
      summary: 取引更新
      description: >-
        取引の内容を更新する。銘柄の付け替えは不可（stockId は既存値のまま扱う）。
        更新後に保有株数・投資額を再計算し、先行する BUY の無い SELL が生じる場合は
        INVALID_TRANSACTION_ORDER で拒否する。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '200':
          description: 取引更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
        '400':
          description: 入力不正、または取引順序が成立しない（INVALID_TRANSACTION_ORDER）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: 取引履歴の編集・削除が設定で許可されていない（FORBIDDEN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [transactions]
      summary: 取引削除
      description: 取引を削除し、保有株数・投資額を再計算する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
        '400':
          description: 削除すると取引順序が成立しない（INVALID_TRANSACTION_ORDER）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: 取引履歴の編集・削除が設定で許可されていない（FORBIDDEN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions/summary:
    get:
      tags: [transactions]
      summary: 期間別取引サマリー
      description: >-
        指定期間の取引サマリーを取得。金額はすべて円換算後の値（ドル建ての取引は
        当日レートで換算してから合算する。ADR 0005）。
      parameters:
        - name: period
          in: query
          description: 集計期間
          schema:
            type: string
            enum: [week, month, quarter, year, custom]
            default: month
        - name: startDate
          in: query
          description: 開始日（custom期間時）
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: 終了日（custom期間時）
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 取引サマリー取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      totalTransactions:
                        type: integer
                        description: 指定期間の取引件数
                      totalBuyAmount:
                        type: number
                        format: decimal
                      totalSellAmount:
                        type: number
                        format: decimal
                      totalDividend:
                        type: number
                        format: decimal
                        description: >-
                          当年（カレンダー年、ADR 0004）の受取配当。手取り基準で、
                          受取金額を持たない旧レコードは税引前で代用する（ADR 0015）
                      totalFees:
                        type: number
                        format: decimal
                      periodStats:
                        type: object
                        description: 当月・当年の集計（期間指定とは独立に JST の暦で区切る）
                        properties:
                          thisMonth:
                            $ref: '#/components/schemas/TransactionPeriodStats'
                          thisYear:
                            $ref: '#/components/schemas/TransactionPeriodStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 受取配当管理
  /dividends:
    get:
      tags: [dividends]
      summary: 受取配当一覧取得
      description: >-
        受取配当の一覧を取得。金額は受取通貨建ての値と、当日レートで円換算した値
        （dividendAmountJpy / netAmountJpy）の両方を返す（ADR 0006）。
      parameters:
        - name: stockId
          in: query
          description: 銘柄IDフィルター
          schema:
            type: integer
        - name: year
          in: query
          description: 支払日の年フィルター（カレンダー年、ADR 0004）
          schema:
            type: integer
        - name: startDate
          in: query
          description: 開始日
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: 終了日
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 受取配当取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      dividends:
                        type: array
                        items:
                          $ref: '#/components/schemas/DividendListItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [dividends]
      summary: 受取配当追加
      description: >-
        証券会社の配当明細 1 行を写して登録する（ADR 0015）。
        配当・分配金合計は「1 株あたり配当金 × 数量」で確定する。数量は明細の数量を
        必須入力とし、現在の保有株数は参照しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DividendInput'
      responses:
        '201':
          description: 受取配当追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/DividendWithStock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dividends/{id}:
    get:
      tags: [dividends]
      summary: 受取配当詳細取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 受取配当取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/DividendWithStock'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [dividends]
      summary: 受取配当削除
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dividends/summary:
    get:
      tags: [dividends]
      summary: 受取配当サマリー
      description: >-
        カレンダー年（ADR 0004）の受取配当サマリー。合計は手取り基準で、受取金額を
        持たない旧レコードは税引前で代用する（ADR 0015）。金額は円換算済み。
      parameters:
        - name: year
          in: query
          description: 対象年（既定は当年）
          schema:
            type: integer
      responses:
        '200':
          description: サマリー取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      year:
                        type: integer
                      yearTotal:
                        type: number
                        format: decimal
                        description: 手取り基準の年間受取額
                      yearGrossTotal:
                        type: number
                        format: decimal
                        description: 税引前の年間合計
                      yearTaxTotal:
                        type: number
                        format: decimal
                        description: 年間税額（税引前 − 手取り）
                      firstHalfTotal:
                        type: number
                        format: decimal
                      secondHalfTotal:
                        type: number
                        format: decimal
                      prevYearTotal:
                        type: number
                        format: decimal
                      yearOverYearDiff:
                        type: number
                        format: decimal
                      count:
                        type: integer
                      byStock:
                        type: array
                        description: 銘柄別の内訳（手取り合計の降順）
                        items:
                          $ref: '#/components/schemas/DividendByStock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 価格管理
  /prices/update:
    post:
      tags: [prices]
      summary: 現在値手動更新
      description: 保有銘柄の現在値を手動で更新
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                stockIds:
                  type: array
                  items:
                    type: integer
                  description: 特定銘柄のみ更新する場合
      responses:
        '200':
          description: 価格更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      updatedCount:
                        type: integer
                      failedCount:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            stockId:
                              type: integer
                            stockName:
                              type: string
                            success:
                              type: boolean
                            oldPrice:
                              type: number
                            newPrice:
                              type: number
                            error:
                              type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /prices/history/{stockId}:
    get:
      tags: [prices]
      summary: 価格履歴取得
      description: 指定銘柄の価格履歴を取得
      parameters:
        - name: stockId
          in: path
          required: true
          schema:
            type: integer
        - name: days
          in: query
          description: 取得日数
          schema:
            type: integer
            default: 30
        - name: interval
          in: query
          description: データ間隔
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
      responses:
        '200':
          description: 価格履歴取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      stockId:
                        type: integer
                      stockName:
                        type: string
                      history:
                        type: array
                        items:
                          $ref: '#/components/schemas/PriceHistory'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 合計情報・サマリー
  /summary:
    get:
      tags: [summary]
      summary: 全体サマリー取得
      description: ポートフォリオ全体のサマリー情報を取得
      responses:
        '200':
          description: サマリー取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/PortfolioSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 証券会社マスタ
  /brokers:
    get:
      tags: [brokers]
      summary: 証券会社一覧取得
      description: 証券会社マスタを名前順で取得
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Broker'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [brokers]
      summary: 証券会社追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: 追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Broker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /brokers/{id}:
    put:
      tags: [brokers]
      summary: 証券会社名の更新
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Broker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [brokers]
      summary: 証券会社削除
      description: >-
        その証券会社を使っている銘柄が 1 件でもあれば削除できない（IN_USE）。
        削除成功時は本文を返さない（204）。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 削除成功（本文なし）
        '400':
          description: 使用中のため削除できない（IN_USE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # アプリ設定
  /settings:
    get:
      tags: [settings]
      summary: アプリ設定取得
      description: 真偽値フラグをまとめて返す
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      allowTransactionEdit:
                        type: boolean
                        description: 取引履歴の編集・削除を許可するか（既定 false）
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [settings]
      summary: アプリ設定更新
      description: 許可リスト外のキーは拒否する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  enum: [allowTransactionEdit]
                value:
                  type: boolean
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # データインポート
  /import/tsv:
    post:
      tags: [import]
      summary: TSVファイルインポート
      description: TSVファイルから銘柄データをインポート
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: TSVファイル
                options:
                  type: object
                  properties:
                    replaceExisting:
                      type: boolean
                      default: false
                      description: 既存データを置換するか
                    skipHeader:
                      type: boolean
                      default: true
                      description: ヘッダー行をスキップするか
      responses:
        '200':
          description: インポート成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      imported:
                        type: integer
                      updated:
                        type: integer
                      skipped:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            line:
                              type: integer
                            error:
                              type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # バッチ処理（現在値取得）
  /batch/price-update:
    post:
      tags: [batch]
      summary: 価格自動更新バッチ
      description: 保有株式の現在値を自動更新（前場11:30、後場15:00実行）
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: バッチ処理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      batchId:
                        type: string
                        description: バッチID
                      executedAt:
                        type: string
                        format: date-time
                        description: 実行日時
                      session:
                        type: string
                        enum: [morning, afternoon, after_hours]
                        description: 市場セッション
                      updatedCount:
                        type: integer
                        description: 更新成功件数
                      failedCount:
                        type: integer
                        description: 更新失敗件数
                      totalProcessed:
                        type: integer
                        description: 処理対象件数
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            stockId:
                              type: integer
                            stockName:
                              type: string
                            success:
                              type: boolean
                            oldPrice:
                              type: number
                              format: decimal
                            newPrice:
                              type: number
                              format: decimal
                            error:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # バッチ処理（日次終値・日次USD/JPYレートの取り込み）
  /batch/daily-close:
    get:
      tags: [batch]
      summary: 日次終値の取り込み（定期実行）
      description: |
        Vercel Cron からの定期実行用（ADR 0013）。1 日 1 回、JST 08:00〜08:59 に呼ばれる。
        Vercel が `Authorization: Bearer $CRON_SECRET` を付けて GET で叩く。
        `CRON_SECRET` が未設定の場合は常に 401 を返す。
      security:
        - CronSecretAuth: []
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, max]
            default: 1mo
          description: 取り込む期間。既定の 1mo なら数日止まっていても取り戻せる
      responses:
        '200':
          description: バッチ処理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyCloseBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [batch]
      summary: 日次終値の取り込み（手動実行）
      description: |
        初回バックフィル（`range=2y` など）や cron 失敗後の取り戻しに使う（ADR 0009）。
        既存レコードは上書きしないため、重複実行しても安全。
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                range:
                  type: string
                  enum: [5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, max]
                  default: 1mo
      responses:
        '200':
          description: バッチ処理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyCloseBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # バッチ処理（初期残高 Transaction の生成）
  /batch/initial-balance:
    post:
      tags: [batch]
      summary: 初期残高 Transaction の生成
      description: >-
        TSV インポート由来の保有に「起点日にこの株数を保有していた」取引を 1 件ずつ作る
        （ADR 0008）。一度きりの移行作業だが、何度実行しても結果が変わらないため再実行しても
        安全。既定は dry-run で DB を変更せず、{"apply": true} を渡したときだけ書き込む。
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply:
                  type: boolean
                  default: false
                  description: true のときだけ実際に書き込む
      responses:
        '200':
          description: 実行成功（dry-run を含む）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      applied:
                        type: boolean
                        description: 実際に書き込んだか（false は dry-run）
                      createdCount:
                        type: integer
                      created:
                        type: array
                        description: 作成した（または作成予定の）初期残高
                        items:
                          type: object
                      skipped:
                        type: array
                        description: 対象外とした銘柄と理由
                        items:
                          type: object
                      mismatches:
                        type: array
                        description: 移行後に集計値が移行前と一致しなかった銘柄（空が成功条件）
                        items:
                          type: object
                      unbackedSells:
                        type: array
                        description: 取得原価が失われていて自動復元できない銘柄（手動対応が必要）
                        items:
                          type: object
                      message:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        data:
          type: object
          description: レスポンスデータ
        timestamp:
          type: string
          format: date-time
          description: レスポンス生成時刻

    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true
        timestamp:
          type: string
          format: date-time

    DailyCloseBatchResult:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                executedAt:
                  type: string
                  format: date-time
                range:
                  type: string
                exchangeRate:
                  type: object
                  description: 日次 USD/JPY レートの取り込み結果
                  properties:
                    range:
                      type: string
                    success:
                      type: boolean
                    savedCount:
                      type: integer
                    error:
                      type: string
                dailyPrice:
                  type: object
                  description: 日次終値の取り込み結果
                  properties:
                    targetCount:
                      type: integer
                      description: 対象銘柄数（保有株数 > 0）
                    successCount:
                      type: integer
                    failedCount:
                      type: integer
                    savedCount:
                      type: integer
                      description: 新規保存したレコード数（既存日は上書きしない）
                    failures:
                      type: array
                      description: 失敗した銘柄のみ。成功分は応答が膨らむため含めない
                      items:
                        type: object
                        properties:
                          stockId:
                            type: integer
                          code:
                            type: string
                          success:
                            type: boolean
                          savedCount:
                            type: integer
                          error:
                            type: string

    CompositionItem:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
          format: decimal
        percentage:
          type: number
          format: decimal

    Stock:
      type: object
      properties:
        id:
          type: integer
        no:
          type: integer
          description: TSVのNo列
        stockName:
          type: string
        holdingCompany:
          type: string
        market:
          type: string
          enum: [国内, 米国]
        code:
          type: string
        sharesHeld:
          type: number
          format: decimal
        avgAcquisitionPrice:
          type: number
          format: decimal
        investmentAmount:
          type: number
          format: decimal
        currentPrice:
          type: number
          format: decimal
        profitLoss:
          type: number
          format: decimal
        profitLossRate:
          type: number
          format: decimal
        dividendPerShare:
          type: number
          format: decimal
        dividendYield:
          type: number
          format: decimal
        dividendAmount:
          type: number
          format: decimal
        firstPurchaseDate:
          type: string
          format: date
          nullable: true
          description: 初回購入日（最初の BUY の取引日。買い増ししても動かない）
        purchaseDate:
          type: string
          format: date
          nullable: true
          description: 最終購入日（最後の BUY の取引日）
        saleDate:
          type: string
          format: date
          nullable: true
          description: 最終売却日（最後の SELL の取引日）
        realizedProfitLoss:
          type: number
          format: decimal
          nullable: true
        targetPrice:
          type: number
          format: decimal
          nullable: true
        marketSector:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        lastPriceUpdate:
          type: string
          format: date-time
          nullable: true
        priceUpdateStatus:
          type: string
          enum: [success, error, pending]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StockInput:
      type: object
      required:
        - stockName
        - holdingCompany
        - market
        - code
      properties:
        no:
          type: integer
        stockName:
          type: string
        holdingCompany:
          type: string
        market:
          type: string
          enum: [国内, 米国]
        code:
          type: string
        sharesHeld:
          type: number
          format: decimal
          default: 0
        avgAcquisitionPrice:
          type: number
          format: decimal
          default: 0
        investmentAmount:
          type: number
          format: decimal
          default: 0
        dividendPerShare:
          type: number
          format: decimal
          default: 0
        dividendYield:
          type: number
          format: decimal
          default: 0
        purchaseDate:
          type: string
          format: date
          nullable: true
        targetPrice:
          type: number
          format: decimal
          nullable: true
        marketSector:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true

    StockDetail:
      allOf:
        - $ref: '#/components/schemas/Stock'
        - type: object
          properties:
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
            dividendHistory:
              type: array
              items:
                $ref: '#/components/schemas/DividendHistory'
            priceHistory:
              type: array
              items:
                $ref: '#/components/schemas/PriceHistory'

    # 単体取得（GET /transactions/{id}）・追加（POST）・更新（PUT）が返す形。
    # 金額は銘柄の建値通貨建て（米国株はドル建て、ADR 0005）。
    Transaction:
      type: object
      properties:
        id:
          type: integer
        stockId:
          type: integer
        stockName:
          type: string
        stockCode:
          type: string
        transactionType:
          type: string
          enum: [BUY, SELL]
        shares:
          type: number
          format: decimal
        pricePerShare:
          type: number
          format: decimal
          description: 建値通貨建ての単価（円換算しない）
        totalAmount:
          type: number
          format: decimal
          description: 建値通貨建ての取引金額
        fee:
          type: number
          format: decimal
          default: 0
          description: 建値通貨建ての手数料
        transactionDate:
          type: string
          format: date-time
          description: 取引日。暦日なので時刻は 00:00:00Z で返る（ADR 0012）
        memo:
          type: string
          nullable: true

    # 一覧（GET /transactions）が返す形。建値通貨の値に加えて円換算値を持つ。
    TransactionListItem:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            market:
              type: string
              description: 銘柄の市場。建値通貨を決める（ADR 0005）
              enum: [国内, 米国]
            totalAmountJpy:
              type: number
              format: decimal
              description: 取引金額を当日レートで円換算した値
            feeJpy:
              type: number
              format: decimal
              description: 手数料を当日レートで円換算した値

    TransactionPeriodStats:
      type: object
      properties:
        buyCount:
          type: integer
        sellCount:
          type: integer
        totalAmount:
          type: number
          format: decimal
          description: 円換算後の合計金額（購入・売却の区別なく合算する）

    TransactionInput:
      type: object
      required:
        - stockId
        - transactionType
        - shares
        - pricePerShare
        - transactionDate
      properties:
        stockId:
          type: integer
          description: PUT では無視され、既存の銘柄のまま更新される（銘柄の付け替えは不可）
        transactionType:
          type: string
          enum: [BUY, SELL]
        shares:
          type: number
          format: decimal
        pricePerShare:
          type: number
          format: decimal
          description: 建値通貨建てで渡す（米国株はドル）
        totalAmount:
          type: number
          format: decimal
          description: 省略時は shares × pricePerShare で確定する
        fee:
          type: number
          format: decimal
          default: 0
        transactionDate:
          type: string
          format: date
        memo:
          type: string
          nullable: true

    # 受取配当 1 件（DB のレコードそのまま）。金額はすべて受取通貨建て（ADR 0006）。
    # 銘柄詳細（StockDetail.dividendHistory）が返すのはこの形。
    DividendHistory:
      type: object
      properties:
        id:
          type: integer
        stockId:
          type: integer
        dividendAmount:
          type: number
          format: decimal
          description: >-
            配当・分配金合計（税引前）。POST 時は 1 株あたり配当金 (dividendPerShare)
            と明細の数量 (shares) を受け取り、その積で確定・保存する（BR-202 / ADR 0015）。
            現在の保有株数 (Stock.sharesHeld) は使わない。
        shares:
          type: number
          format: decimal
          nullable: true
          description: 明細の数量（配当計算の対象株数）。ADR 0015 以前の旧レコードは null
        taxAmount:
          type: number
          format: decimal
          nullable: true
          description: 税額合計。null は税額不明（旧レコード、または両方未入力）
        netAmount:
          type: number
          format: decimal
          nullable: true
          description: 受取金額（手取り）。集計の基準。null のときだけ税引前で代用する
        currency:
          type: string
          enum: [JPY, USD]
          description: 受取通貨。銘柄の市場とは独立に持つ（ADR 0006）
        paymentDate:
          type: string
          format: date-time
          description: 支払日。暦日なので時刻は 00:00:00Z で返る（ADR 0012）
        dividendType:
          type: string
          nullable: true
          description: 表示専用ラベル。任意（未指定は null）。集計には使わない
          enum: [期末, 中間, 四半期, 特別, 分配金]
        createdAt:
          type: string
          format: date-time

    # 受取配当エンドポイント（単体取得・追加）が返す形。銘柄名を添え、createdAt は返さない。
    DividendWithStock:
      allOf:
        - $ref: '#/components/schemas/DividendHistory'
        - type: object
          properties:
            stockName:
              type: string
            stockCode:
              type: string
            holdingCompany:
              type: string

    # 一覧（GET /dividends）が返す形。受取通貨の値に加えて円換算値を持つ。
    DividendListItem:
      allOf:
        - $ref: '#/components/schemas/DividendWithStock'
        - type: object
          properties:
            dividendAmountJpy:
              type: number
              format: decimal
              description: 税引前の配当合計を当日レートで円換算した値
            netAmountJpy:
              type: number
              format: decimal
              description: 手取りを当日レートで円換算した値（netAmount が null なら税引前で代用）

    DividendInput:
      type: object
      required:
        - stockId
        - dividendPerShare
        - shares
        - paymentDate
      properties:
        stockId:
          type: integer
        dividendPerShare:
          type: number
          format: decimal
          description: 明細の「単価」（1 株あたり配当金）。受取通貨建て
        shares:
          type: number
          format: decimal
          description: 明細の「数量」。0 より大きい値が必須（保有株数で補完しない）
        taxAmount:
          type: number
          format: decimal
          nullable: true
          description: >-
            明細の「税額合計」。空欄可。片方だけ入れるともう片方は
            「配当合計 − 入力値」で埋まる。両方入れた場合はそのまま採り、
            合計との一致は検証しない（米国株は一致しないため。ADR 0015）
        netAmount:
          type: number
          format: decimal
          nullable: true
          description: 明細の「受取金額」。空欄可
        currency:
          type: string
          enum: [JPY, USD]
          default: JPY
        paymentDate:
          type: string
          format: date
        dividendType:
          type: string
          nullable: true
          enum: [期末, 中間, 四半期, 特別, 分配金]

    DividendByStock:
      type: object
      properties:
        stockId:
          type: integer
        stockName:
          type: string
        stockCode:
          type: string
        holdingCompany:
          type: string
        total:
          type: number
          format: decimal
          description: 手取り基準・円換算後の年間合計
        firstHalf:
          type: number
          format: decimal
        secondHalf:
          type: number
          format: decimal
        count:
          type: integer

    Broker:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # 証券会社別保有一覧の 1 グループ。
    BrokerHoldings:
      type: object
      properties:
        brokerName:
          type: string
        stockCount:
          type: integer
        totalInvestment:
          type: number
          format: decimal
        totalCurrentValue:
          type: number
          format: decimal
        totalProfitLoss:
          type: number
          format: decimal
        totalProfitLossRate:
          type: number
          format: decimal
          description: パーセント値（例 12.3 は +12.3%）
        totalYtdDividend:
          type: number
          format: decimal
          description: >-
            年初来の受取配当合計。手取り基準（ADR 0015）で、受取通貨ごとに
            当日レートで円換算してから合算する（ADR 0006）
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/HoldingRow'

    HoldingRow:
      type: object
      properties:
        id:
          type: integer
        stockName:
          type: string
        code:
          type: string
        market:
          type: string
          enum: [国内, 米国]
        sharesHeld:
          type: number
          format: decimal
        avgAcquisitionPrice:
          type: number
          format: decimal
          description: 建値通貨建て（円換算しない）
        investmentAmount:
          type: number
          format: decimal
          description: 円換算済み
        currentPrice:
          type: number
          format: decimal
          description: 建値通貨建て（円換算しない）
        currentValue:
          type: number
          format: decimal
          description: 円換算済み
        profitLoss:
          type: number
          format: decimal
          description: 円換算済み
        profitLossRate:
          type: number
          format: decimal
        ytdDividend:
          type: number
          format: decimal
          description: 年初来の受取配当。手取り基準・円換算済み
        priceUpdateStatus:
          type: string
          enum: [SUCCESS, ERROR, PENDING]
        priceUpdateError:
          type: string
          nullable: true

    HoldingsGrandTotal:
      type: object
      properties:
        totalInvestment:
          type: number
          format: decimal
        totalCurrentValue:
          type: number
          format: decimal
        totalProfitLoss:
          type: number
          format: decimal
        totalProfitLossRate:
          type: number
          format: decimal
        totalYtdDividend:
          type: number
          format: decimal
        totalStocks:
          type: integer
        brokerCount:
          type: integer

    # 資産推移の 1 日分。すべて円換算済みで、その日のレートで換算する（ADR 0009）。
    TimelinePoint:
      type: object
      properties:
        date:
          type: string
          format: date
        marketValue:
          type: number
          format: decimal
          description: その日の保有株を日次終値で評価した合計
        investedPrincipal:
          type: number
          format: decimal
          description: その日に投じている取得原価の合計
        unrealizedPL:
          type: number
          format: decimal
          description: marketValue − investedPrincipal
        cumulativeRealizedPL:
          type: number
          format: decimal
        cumulativeDividends:
          type: number
          format: decimal
        filledStockCount:
          type: integer
          description: 終値が実測値でない銘柄数（前営業日で補完した、または終値が無い）

    TimelineResult:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePoint'
        baselineDate:
          type: string
          format: date
          nullable: true
          description: 起点日。これより前は保有が不明なため返さない（ADR 0008）
        missingPriceStocks:
          type: array
          description: 日次終値が 1 件も無く評価額に算入できなかった銘柄
          items:
            type: object
            properties:
              code:
                type: string
              stockName:
                type: string

    PriceHistory:
      type: object
      properties:
        id:
          type: integer
        stockId:
          type: integer
        price:
          type: number
          format: decimal
        recordedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [yahoo, rakuten, manual]
        marketSession:
          type: string
          enum: [morning, afternoon, after_hours]
        createdAt:
          type: string
          format: date-time

    PortfolioSummary:
      type: object
      properties:
        totalInvestment:
          type: number
          format: decimal
          description: 全投資額
        totalCurrentValue:
          type: number
          format: decimal
          description: 現在の評価額
        totalProfitLoss:
          type: number
          format: decimal
          description: 全体損益
        totalProfitLossRate:
          type: number
          format: decimal
          description: 全体損益率
        totalDividend:
          type: number
          format: decimal
          description: 全体配当金額
        stockCount:
          type: integer
          description: 保有銘柄数
        companiesCount:
          type: integer
          description: 証券会社数
        lastUpdated:
          type: string
          format: date-time
          description: 最終更新日時
        marketBreakdown:
          type: object
          properties:
            domestic:
              type: object
              properties:
                investment:
                  type: number
                profitLoss:
                  type: number
                stockCount:
                  type: integer
            us:
              type: object
              properties:
                investment:
                  type: number
                profitLoss:
                  type: number
                stockCount:
                  type: integer

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
        totalPages:
          type: integer
        totalCount:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

  responses:
    BadRequest:
      description: リクエストが不正です
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: 'BAD_REQUEST'
              message: 'リクエストパラメータが不正です'
            timestamp: '2023-12-01T12:00:00Z'

    Unauthorized:
      description: 認証が必要です
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: 'UNAUTHORIZED'
              message: 'APIキーが無効です'
            timestamp: '2023-12-01T12:00:00Z'

    NotFound:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: 'NOT_FOUND'
              message: '指定された銘柄が見つかりません'
            timestamp: '2023-12-01T12:00:00Z'

    InternalServerError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: 'INTERNAL_SERVER_ERROR'
              message: 'サーバー内部でエラーが発生しました'
            timestamp: '2023-12-01T12:00:00Z'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: バッチ処理を手動実行するときのAPIキー
    CronSecretAuth:
      type: http
      scheme: bearer
      description: |
        Vercel Cron が付ける `Authorization: Bearer $CRON_SECRET`（ADR 0013）。
        Vercel のプロジェクト環境変数 `CRON_SECRET` の値と照合する。
    SessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        画面ログイン（Google OAuth）で発行される NextAuth のセッション Cookie。
        HTTPS 環境では Cookie 名が `__Secure-next-auth.session-token` になる。
